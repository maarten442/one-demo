<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoppenbrouwers Conference Demo</title>
    <style>
        :root {
            color-scheme: light;
            --base-bg: #020617;
            --glow-1: #1d4ed8;
            --glow-2: #0f172a;
            --text-primary: #f8fafc;
            --text-muted: #cbd5f5;
            --assistant: #111827;
            --user: #38bdf8;
            --accent: rgba(56, 189, 248, 0.35);
            --tab-bg: rgba(15, 23, 42, 0.55);
            --tab-active: rgba(56, 189, 248, 0.2);
            --border: rgba(148, 163, 184, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top right, rgba(29, 78, 216, 0.35), var(--base-bg) 55%);
            color: var(--text-primary);
            padding: 40px 16px;
        }

        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            text-align: center;
        }

        .stage h1 {
            font-size: clamp(1.8rem, 2.4vw, 2.4rem);
            letter-spacing: -0.02em;
        }

        .stage p {
            max-width: 520px;
            color: rgba(203, 213, 225, 0.9);
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .phone-frame {
            position: relative;
            width: min(360px, 88vw);
            height: min(760px, 85vh);
            border-radius: 44px;
            padding: 14px;
            background: linear-gradient(145deg, rgba(15, 15, 16, 0.9), rgba(55, 65, 81, 0.35));
            box-shadow: 0 40px 80px rgba(2, 6, 23, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .notch {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 24px;
            border-radius: 14px;
            background: #000;
        }

        .phone-inner {
            position: relative;
            margin-top: 36px;
            flex: 1;
            min-height: 0;
            width: 100%;
            border-radius: 32px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.98));
            padding: 22px 18px 32px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(148, 163, 184, 0.08);
            overflow: hidden;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.72rem;
            color: rgba(203, 213, 225, 0.75);
            margin-bottom: 12px;
        }

        .status-bar span:last-child {
            display: inline-flex;
            gap: 6px;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 14px 14px 8px;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(148, 163, 184, 0.12);
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.45);
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.9), rgba(56, 189, 248, 0.55));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: 0.04em;
        }

        .details h2 {
            font-size: 1.05rem;
            letter-spacing: -0.01em;
        }

        .details p {
            color: var(--text-muted);
            font-size: 0.78rem;
            margin-top: 2px;
        }

        .scenario-summary {
            margin: 12px 0 16px;
            font-size: 0.82rem;
            color: rgba(203, 213, 225, 0.75);
            line-height: 1.4;
        }

        .scenario-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(15, 23, 42, 0.55);
            padding: 8px;
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.12);
            margin-bottom: 16px;
        }

        .scenario-tab {
            appearance: none;
            border: none;
            border-radius: 14px;
            padding: 10px 8px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            background: transparent;
            color: rgba(226, 232, 240, 0.8);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .scenario-tab.active {
            background: var(--tab-active);
            color: var(--text-primary);
            box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.45);
        }

        .conversation-window {
            flex: 1;
            min-height: 0;
            background: rgba(2, 6, 23, 0.45);
            border-radius: 22px;
            padding: 18px 14px 72px;
            border: 1px solid rgba(148, 163, 184, 0.08);
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            box-shadow: inset 0 20px 40px rgba(15, 23, 42, 0.35);
        }

        .message {
            max-width: 85%;
            padding: 14px 16px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.45;
            position: relative;
            opacity: 0;
            transform: translateY(12px);
            background: var(--assistant);
            color: rgba(226, 232, 240, 0.95);
            box-shadow: 0 18px 32px rgba(15, 23, 42, 0.36);
            animation: fadeInUp 0.45s forwards ease;
        }

        .message.user {
            margin-left: auto;
            background: var(--user);
            color: #0f172a;
            border-bottom-right-radius: 6px;
        }

        .message.assistant {
            border-bottom-left-radius: 6px;
        }

        .message ul {
            margin-top: 10px;
            margin-left: 18px;
            display: grid;
            gap: 6px;
        }

        .message p + p {
            margin-top: 10px;
        }

        .message .link {
            color: #38bdf8;
            font-weight: 600;
        }

        .typing-wrapper {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            animation: none !important;
        }

        .typing {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 14px;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.16);
        }

        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(148, 163, 184, 0.7);
            animation: blink 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        .replay-button {
            position: absolute;
            bottom: 24px;
            right: 24px;
            appearance: none;
            border: 1px solid rgba(56, 189, 248, 0.45);
            background: rgba(56, 189, 248, 0.18);
            color: var(--text-primary);
            border-radius: 999px;
            padding: 10px 18px;
            font-size: 0.78rem;
            letter-spacing: 0.02em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 18px 30px rgba(14, 165, 233, 0.25);
        }

        .replay-button:hover {
            transform: translateY(-1px);
            background: rgba(56, 189, 248, 0.26);
        }

        .home-indicator {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 30%;
            height: 5px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.35);
        }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; }
            40% { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 520px) {
            .stage p {
                font-size: 0.88rem;
            }
            .scenario-tabs {
                grid-template-columns: 1fr 1fr;
            }
            .scenario-tabs button:last-child {
                grid-column: span 2;
            }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div>
            <h1>Hoppenbrouwers Heating Assistant</h1>
            <p>Hardcoded conference demo showing how extra company context upgrades the guidance. Use the on-screen tabs to switch between the three scripted scenarios.</p>
        </div>
        <div class="phone-frame">
            <div class="notch"></div>
            <div class="phone-inner">
                <div class="status-bar">
                    <span>09:41</span>
                    <span><span>LTE</span><span>100%</span></span>
                </div>
                <div class="chat-header">
                    <div class="avatar">HB</div>
                    <div class="details">
                        <h2>Hoppenbrouwers</h2>
                        <p id="scenarioTitle">Scenario 1 (Basic/Public LLM)</p>
                    </div>
                </div>
                <p class="scenario-summary" id="scenarioSummary">Baseline answers with no private knowledge.</p>
                <div class="scenario-tabs">
                    <button class="scenario-tab active" data-scenario="scenario1">Public LLM</button>
                    <button class="scenario-tab" data-scenario="scenario2">LLM + KB</button>
                    <button class="scenario-tab" data-scenario="scenario3">LLM + KB + Systems</button>
                </div>
                <div class="conversation-window" id="conversation"></div>
                <button class="replay-button" id="replayButton" type="button">Replay scenario</button>
            </div>
            <div class="home-indicator"></div>
        </div>
    </div>
    <script>
        const scenarios = {
            scenario1: {
                title: "Scenario 1 (Basic/Public LLM)",
                summary: "Baseline answers with no private knowledge.",
                conversation: [
                    {
                        speaker: "user",
                        text: `I am installing an Intergas HRE 24 combi. After installing I noticed that the water is not warm enough. It should be 60 degrees Celsius.`,
                        delayBefore: 900
                    },
                    {
                        speaker: "assistant",
                        text: `<strong>There are a few possible causes and checks:</strong><ul><li>Temperature setting. It is configurable using the display. Please check the manual to find exact instructions for this model.</li><li>Gas supply issue. Please check if you see the heater active.</li><li>Sensor issue. A faulty NTC sensor (temperature sensor) may cause incorrect readings and limit heating.</li></ul>`,
                        delayBefore: 1400,
                        typingDuration: 1400
                    }
                ]
            },
            scenario2: {
                title: "Scenario 2 (LLM + Knowledge Base)",
                summary: "Assistant uses curated product documents.",
                conversation: [
                    {
                        speaker: "user",
                        text: `I am installing an Intergas HRE 24 combi. After installing I noticed that the water is not warm enough. It should be 60 &deg;C degrees Celsius.`,
                        delayBefore: 900
                    },
                    {
                        speaker: "assistant",
                        text: `According to the information this device should have a setting between 40 &deg;C and 65 &deg;C and 60 &deg;C is the factory default. If that is not the case I can help you further search for the answer. Do you want that?`,
                        delayBefore: 1500,
                        typingDuration: 1600
                    },
                    {
                        speaker: "user",
                        text: `Yes`,
                        delayBefore: 1700
                    },
                    {
                        speaker: "assistant",
                        text: `Check the configured value from the display by holding the SET button and wait until the tapwater indicator is blinking. You can adjust the setting there. Did this solve your problem?`,
                        delayBefore: 1400,
                        typingDuration: 1400
                    },
                    {
                        speaker: "user",
                        text: `No`,
                        delayBefore: 1700
                    },
                    {
                        speaker: "assistant",
                        text: `Ok. Let's continue. One of the other most common issues is regarding tapflow (the amount of water per minute). For this device the nominal flow is 6 liter/min for 60 &deg;C. Check the amount of water, if that is too high you should place or configure a dosage wheel. Here is the instruction video to solve this problem: <span class="link">video (projector icon)</span> Did this solve the problem for you?`,
                        delayBefore: 1800,
                        typingDuration: 1800
                    },
                    {
                        speaker: "user",
                        text: `Yes! Thank you`,
                        delayBefore: 1900
                    }
                ]
            },
            scenario3: {
                title: "Scenario 3 (LLM + Knowledge Base + Integrations)",
                summary: "Assistant combines documents with live system data and order context.",
                conversation: [
                    {
                        speaker: "user",
                        text: `I am installing an Intergas HRE 24 combi. After installing I noticed that the water is not warm enough. It should be 60 &deg;C degrees Celsius.`,
                        delayBefore: 900
                    },
                    {
                        speaker: "assistant",
                        text: `Great. According to my data you are busy with order #5032. Is that correct?`,
                        delayBefore: 1600,
                        typingDuration: 1700
                    },
                    {
                        speaker: "user",
                        text: `Yes`,
                        delayBefore: 1700
                    },
                    {
                        speaker: "assistant",
                        text: `Let me review the data...`,
                        delayBefore: 1600,
                        typingDuration: 1800,
                        pauseAfter: 5000
                    },
                    {
                        speaker: "assistant",
                        text: `According to the data of the device I can see a potential conflicting setting. The tap comfort function is set to ECO. That can cause a delay in the supply of hot water. Have you tried it for a long time?`,
                        delayBefore: 900,
                        typingDuration: 1600
                    },
                    {
                        speaker: "user",
                        text: `Yes. Even after a minute it was not at the right temperature.`,
                        delayBefore: 1300
                    },
                    {
                        speaker: "assistant",
                        text: `Ok. Let me check...`,
                        delayBefore: 1500,
                        typingDuration: 1500,
                        pauseAfter: 2200
                    },
                    {
                        speaker: "assistant",
                        text: `According to the data, the water pressure in the central heating system is not above the minimum level. This device needs to have a properly working heating system for the tap water function to work correctly. Can you please check that?`,
                        delayBefore: 1000,
                        typingDuration: 1800
                    },
                    {
                        speaker: "user",
                        text: `The installation was not finished yet, but I was trying to do some checks already. I will finish up the installation first then.`,
                        delayBefore: 1300
                    },
                    {
                        speaker: "assistant",
                        text: `Ok. If you want any help with the checklist at the end, let me know. I can help you finish up the order with some system checks.`,
                        delayBefore: 1600,
                        typingDuration: 1600
                    }
                ]
            }
        };

        const conversationWindow = document.getElementById("conversation");
        const titleEl = document.getElementById("scenarioTitle");
        const summaryEl = document.getElementById("scenarioSummary");
        const replayButton = document.getElementById("replayButton");
        const scenarioTabs = document.querySelectorAll(".scenario-tab");

        let activeScenario = "scenario1";
        let timers = [];
        let typingIndicators = [];

        function clearTimers() {
            timers.forEach(clearTimeout);
            timers = [];
            typingIndicators.forEach(indicator => indicator.remove());
            typingIndicators = [];
        }

        function scrollToBottom() {
            conversationWindow.scrollTop = conversationWindow.scrollHeight;
        }

        function createMessageElement(message) {
            const bubble = document.createElement("div");
            bubble.className = `message ${message.speaker}`;
            bubble.innerHTML = message.text;
            conversationWindow.appendChild(bubble);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const wrapper = document.createElement("div");
            wrapper.className = "message assistant typing-wrapper";
            const bubble = document.createElement("div");
            bubble.className = "typing";
            bubble.innerHTML = "<span></span><span></span><span></span>";
            wrapper.appendChild(bubble);
            conversationWindow.appendChild(wrapper);
            typingIndicators.push(wrapper);
            scrollToBottom();
            return wrapper;
        }

        function playScenario(id) {
            clearTimers();
            conversationWindow.innerHTML = "";
            activeScenario = id;

            const current = scenarios[id];
            titleEl.textContent = current.title;
            summaryEl.textContent = current.summary;

            scenarioTabs.forEach(button => {
                const matches = button.dataset.scenario === id;
                button.classList.toggle("active", matches);
            });

            let elapsed = 600;

            current.conversation.forEach(message => {
                const delayBefore = typeof message.delayBefore === "number" ? message.delayBefore : (message.speaker === "assistant" ? 1200 : 600);
                const typingDuration = typeof message.typingDuration === "number" ? message.typingDuration : (message.speaker === "assistant" ? 1100 : 0);
                const pauseAfter = typeof message.pauseAfter === "number" ? message.pauseAfter : 450;

                elapsed += delayBefore;

                if (message.speaker === "assistant") {
                    timers.push(setTimeout(() => {
                        const indicator = showTypingIndicator();
                        timers.push(setTimeout(() => {
                            indicator.remove();
                            typingIndicators = typingIndicators.filter(item => item !== indicator);
                            createMessageElement(message);
                        }, Math.max(typingDuration, 400)));
                    }, elapsed));
                    elapsed += Math.max(typingDuration, 400);
                } else {
                    timers.push(setTimeout(() => {
                        createMessageElement(message);
                    }, elapsed));
                }

                elapsed += pauseAfter;
            });
        }

        scenarioTabs.forEach(button => {
            button.addEventListener("click", () => {
                const id = button.dataset.scenario;
                if (id !== activeScenario) {
                    playScenario(id);
                }
            });
        });

        replayButton.addEventListener("click", () => {
            playScenario(activeScenario);
        });

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") {
                clearTimers();
            } else {
                playScenario(activeScenario);
            }
        });

        playScenario(activeScenario);
    </script>
</body>
</html>
