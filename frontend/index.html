<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Demo - Heating Assistant</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #0f172a;
            --panel: #1d293b;
            --panel-dark: #111827;
            --text: #f8fafc;
            --muted: #cbd5f5;
            --accent: #38bdf8;
            --accent-soft: rgba(56, 189, 248, 0.2);
            --user-bubble: #38bdf8;
            --assistant-bubble: #1f2937;
            --shadow: 0 25px 60px rgba(15, 23, 42, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top right, #1e3a8a, #020617 55%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .app-shell {
            width: min(1080px, 100%);
            background: linear-gradient(125deg, rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.7));
            border-radius: 32px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(22px);
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.15);
        }

        header {
            padding: 40px 44px 20px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.65), rgba(15, 23, 42, 0.85));
        }

        header h1 {
            font-size: clamp(1.8rem, 2.4vw, 2.6rem);
            font-weight: 700;
            letter-spacing: -0.015em;
            color: white;
        }

        header p {
            margin-top: 10px;
            font-size: 0.98rem;
            color: rgba(226, 232, 240, 0.9);
            max-width: 680px;
            line-height: 1.5;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 0;
        }

        .scenario-list {
            background: linear-gradient(180deg, rgba(30, 58, 138, 0.15), rgba(15, 23, 42, 0.75));
            padding: 28px;
            border-right: 1px solid rgba(148, 163, 184, 0.12);
        }

        .scenario-list h2 {
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 18px;
            color: rgba(148, 163, 184, 0.9);
        }

        .scenario-button {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            padding: 18px;
            margin-bottom: 14px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid transparent;
            color: inherit;
            cursor: pointer;
            text-align: left;
            transition: all 0.24s ease;
        }

        .scenario-button strong {
            font-size: 1.05rem;
            letter-spacing: -0.01em;
        }

        .scenario-button span {
            font-size: 0.86rem;
            color: rgba(148, 163, 184, 0.9);
        }

        .scenario-button:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.4);
        }

        .scenario-button.active {
            background: rgba(56, 189, 248, 0.16);
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 18px 40px rgba(14, 165, 233, 0.25);
        }

        .conversation-panel {
            padding: 32px 34px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .panel-header .title-block h3 {
            font-size: 1.12rem;
            letter-spacing: -0.01em;
        }

        .panel-header .title-block p {
            font-size: 0.86rem;
            color: rgba(148, 163, 184, 0.88);
            margin-top: 4px;
        }

        .replay-button {
            appearance: none;
            border: 1px solid rgba(56, 189, 248, 0.5);
            background: rgba(56, 189, 248, 0.16);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.85rem;
            letter-spacing: 0.02em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .replay-button:hover {
            transform: translateY(-1px);
            background: rgba(56, 189, 248, 0.25);
        }

        .conversation-window {
            flex: 1;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.76), rgba(15, 23, 42, 0.94) 55%, rgba(2, 6, 23, 0.95));
            border-radius: 22px;
            padding: 26px 26px 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            border: 1px solid rgba(148, 163, 184, 0.14);
        }

        .message {
            max-width: 75%;
            padding: 15px 18px;
            border-radius: 18px;
            line-height: 1.45;
            font-size: 0.97rem;
            position: relative;
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.32);
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.45s forwards ease;
        }

        .message.user {
            margin-left: auto;
            background: var(--user-bubble);
            color: #0f172a;
            border-bottom-right-radius: 6px;
        }

        .message.assistant {
            background: var(--assistant-bubble);
            color: rgba(226, 232, 240, 0.95);
            border-bottom-left-radius: 6px;
        }

        .message.assistant strong {
            color: white;
        }

        .message ul {
            margin-top: 10px;
            margin-left: 18px;
            display: grid;
            gap: 6px;
        }

        .message p + p {
            margin-top: 10px;
        }

        .message span.link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(125, 211, 252, 0.95);
            font-weight: 600;
        }

        .typing {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 16px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.18);
            width: 120px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(148, 163, 184, 0.7);
            animation: blink 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.18s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.36s;
        }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; }
            40% { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 980px) {
            body {
                padding: 20px;
            }
            .layout {
                grid-template-columns: 1fr;
            }
            .scenario-list {
                border-right: none;
                border-bottom: 1px solid rgba(148, 163, 184, 0.12);
            }
            .conversation-panel {
                padding: 26px;
            }
            .message {
                max-width: 100%;
            }
        }

        @media (max-width: 540px) {
            header {
                padding: 30px 26px 18px;
            }
            .conversation-panel {
                padding: 22px;
            }
            .panel-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .replay-button {
                align-self: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header>
            <h1>Heating Support Assistant Demo</h1>
            <p>Demo of the three phases of the heating support assistant.</p>
        </header>
        <div class="layout">
            <aside class="scenario-list">
                <h2>Scenarios</h2>
                <button class="scenario-button active" data-scenario="scenario1">
                    <strong>Scenario 1 (Basic/Public LLM)</strong>
                    <span>Baseline answers with no private knowledge</span>
                </button>
                <button class="scenario-button" data-scenario="scenario2">
                    <strong>Scenario 2 (LLM + Knowledge Base)</strong>
                    <span>Assistant uses curated product documents</span>
                </button>
                <button class="scenario-button" data-scenario="scenario3">
                    <strong>Scenario 3 (LLM + KB + Integrations)</strong>
                    <span>Assistant combines documents with live system data</span>
                </button>
            </aside>
            <section class="conversation-panel">
                <div class="panel-header">
                    <div class="title-block">
                        <h3 id="scenarioTitle">Scenario 1 (Basic/Public LLM)</h3>
                        <p id="scenarioSummary">Baseline answers with no private knowledge.</p>
                    </div>
                    <button class="replay-button" id="replayButton" type="button">
                        <span>&#x21bb;</span>
                        Replay scenario
                    </button>
                </div>
                <div class="conversation-window" id="conversation"></div>
            </section>
        </div>
    </div>
    <script>
        const scenarios = {
            scenario1: {
                title: 'Scenario 1 (Basic/Public LLM)',
                summary: 'Baseline answers with no private knowledge.',
                conversation: [
                    {
                        speaker: 'user',
                        text: 'I am installing an Intergas HRE 24 combi. After installing I noticed that the water is not warm enough. It should be 60 degrees Celsius.',
                        delayBefore: 600
                    },
                    {
                        speaker: 'assistant',
                        text: '<strong>There are a few possible causes and checks:</strong><ul><li>Temperature setting. It is configurable using the display. Please check the manual to find exact instructions for this model.</li><li>Gas supply issue. Please check if you see the heater active.</li><li>Sensor issue. A faulty NTC sensor (temperature sensor) may cause incorrect readings and limit heating.</li></ul>',
                        delayBefore: 1400,
                        typingDuration: 1400
                    }
                ]
            },
            scenario2: {
                title: 'Scenario 2 (LLM + Knowledge Base)',
                summary: 'Assistant uses curated product documents.',
                conversation: [
                    {
                        speaker: 'user',
                        text: 'I am installing an Intergas HRE 24 combi. After installing I noticed that the water is not warm enough. It should be 60 &deg;C degrees Celsius.',
                        delayBefore: 600
                    },
                    {
                        speaker: 'assistant',
                        text: 'According to the information this device should have a setting between 40 &deg;C and 65 &deg;C and 60 &deg;C is the factory default. If that is not the case I can help you further search for the answer. Do you want that?',
                        delayBefore: 1500,
                        typingDuration: 1600
                    },
                    {
                        speaker: 'user',
                        text: 'Yes',
                        delayBefore: 700
                    },
                    {
                        speaker: 'assistant',
                        text: 'Check the configured value from the display by holding the SET button and wait until the tapwater indicator is blinking. You can adjust the setting there. Did this solve your problem?',
                        delayBefore: 1400,
                        typingDuration: 1400
                    },
                    {
                        speaker: 'user',
                        text: 'No',
                        delayBefore: 700
                    },
                    {
                        speaker: 'assistant',
                        text: 'Ok. Let\'s continue. One of the other most common issues is regarding tapflow (the amount of water per minute). For this device the nominal flow is 6 liter/min for 60 &deg;C. Check the amount of water, if that\'s too high you should place or configure a dosage wheel. Here is the instruction video to solve this problem: <span class="link">video (projector icon)</span> Did this solve the problem for you?',
                        delayBefore: 1800,
                        typingDuration: 1800
                    },
                    {
                        speaker: 'user',
                        text: 'Yes! Thank you',
                        delayBefore: 900
                    }
                ]
            },
            scenario3: {
                title: 'Scenario 3 (LLM + Knowledge Base + Integrations)',
                summary: 'Assistant combines documents with live system data and order context.',
                conversation: [
                    {
                        speaker: 'user',
                        text: 'I am installing an Intergas HRE 24 combi. After installing I noticed that the water is not warm enough. It should be 60 &deg;C degrees Celsius.',
                        delayBefore: 600
                    },
                    {
                        speaker: 'assistant',
                        text: 'Great. According to my data you are busy with order #5032. Is that correct?',
                        delayBefore: 1600,
                        typingDuration: 1700
                    },
                    {
                        speaker: 'user',
                        text: 'Yes',
                        delayBefore: 700
                    },
                    {
                        speaker: 'assistant',
                        text: 'Let me review the data...',
                        delayBefore: 1600,
                        typingDuration: 1800,
                        pauseAfter: 5000
                    },
                    {
                        speaker: 'assistant',
                        text: 'According to the data of the device I can see a potential conflicting setting. The tap comfort function is set to ECO. That can cause a delay in the supply of hot water. Have you tried it for a long time?',
                        delayBefore: 900,
                        typingDuration: 1600
                    },
                    {
                        speaker: 'user',
                        text: 'Yes. Even after a minute it was not at the right temperature.',
                        delayBefore: 700
                    },
                    {
                        speaker: 'assistant',
                        text: 'Ok. Let me check...',
                        delayBefore: 1500,
                        typingDuration: 1500,
                        pauseAfter: 2200
                    },
                    {
                        speaker: 'assistant',
                        text: 'According to the data, the water pressure in the central heating system is not above the minimum level. This device needs to have a properly working heating system for the tap water function to work correctly. Can you please check that?',
                        delayBefore: 1000,
                        typingDuration: 1800
                    },
                    {
                        speaker: 'user',
                        text: 'The installation wasn\'t finished yet, but I was trying to do some checks already. I will finish up the installation first then.',
                        delayBefore: 700
                    },
                    {
                        speaker: 'assistant',
                        text: 'Ok. If you want any help with the checklist at the end, let me know. I can help you finish up the order with some system checks.',
                        delayBefore: 1600,
                        typingDuration: 1600
                    }
                ]
            }
        };

        const conversationWindow = document.getElementById('conversation');
        const titleEl = document.getElementById('scenarioTitle');
        const summaryEl = document.getElementById('scenarioSummary');
        const replayButton = document.getElementById('replayButton');
        const scenarioButtons = document.querySelectorAll('.scenario-button');

        let activeScenario = 'scenario1';
        let timers = [];
        let typingIndicators = [];

        function clearTimers() {
            timers.forEach(clearTimeout);
            timers = [];
            typingIndicators.forEach(indicator => indicator.remove());
            typingIndicators = [];
        }

        function scrollToBottom() {
            conversationWindow.scrollTop = conversationWindow.scrollHeight;
        }

        function createMessageElement(message) {
            const bubble = document.createElement('div');
            bubble.className = `message ${message.speaker}`;
            bubble.innerHTML = message.text;
            conversationWindow.appendChild(bubble);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const wrapper = document.createElement('div');
            wrapper.className = 'message assistant';
            wrapper.style.background = 'transparent';
            wrapper.style.border = 'none';
            wrapper.style.boxShadow = 'none';
            wrapper.style.padding = '0';
            wrapper.style.animation = 'none';

            const bubble = document.createElement('div');
            bubble.className = 'typing';
            bubble.innerHTML = '<span></span><span></span><span></span>';
            wrapper.appendChild(bubble);
            conversationWindow.appendChild(wrapper);
            typingIndicators.push(wrapper);
            scrollToBottom();
            return wrapper;
        }

        function playScenario(id) {
            clearTimers();
            conversationWindow.innerHTML = '';
            activeScenario = id;

            const current = scenarios[id];
            titleEl.textContent = current.title;
            summaryEl.textContent = current.summary;

            scenarioButtons.forEach(button => {
                const matches = button.dataset.scenario === id;
                button.classList.toggle('active', matches);
            });

            let elapsed = 600; // initial pause before first message

            current.conversation.forEach(message => {
                const delayBefore = typeof message.delayBefore === 'number' ? message.delayBefore : (message.speaker === 'assistant' ? 1200 : 600);
                const typingDuration = typeof message.typingDuration === 'number' ? message.typingDuration : (message.speaker === 'assistant' ? 1100 : 0);
                const pauseAfter = typeof message.pauseAfter === 'number' ? message.pauseAfter : 450;

                elapsed += delayBefore;

                if (message.speaker === 'assistant') {
                    timers.push(setTimeout(() => {
                        const indicator = showTypingIndicator();
                        timers.push(setTimeout(() => {
                            indicator.remove();
                            typingIndicators = typingIndicators.filter(item => item !== indicator);
                            createMessageElement(message);
                        }, Math.max(typingDuration, 400)));
                    }, elapsed));
                    elapsed += Math.max(typingDuration, 400);
                } else {
                    timers.push(setTimeout(() => {
                        createMessageElement(message);
                    }, elapsed));
                }

                elapsed += pauseAfter;
            });
        }

        scenarioButtons.forEach(button => {
            button.addEventListener('click', () => {
                const id = button.dataset.scenario;
                if (id !== activeScenario) {
                    playScenario(id);
                }
            });
        });

        replayButton.addEventListener('click', () => {
            playScenario(activeScenario);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                clearTimers();
            } else {
                playScenario(activeScenario);
            }
        });

        playScenario(activeScenario);
    </script>
</body>
</html>
